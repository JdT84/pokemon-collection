function translateQuery(raw) {
  const n = norm(raw);
  if (FR_POKE[n]) return FR_POKE[n];
  for (const fr of Object.keys(FR_POKE)) {
    if (n === fr || n.startsWith(fr + " ")) return FR_POKE[fr] + raw.slice(fr.length);
  }
  const m = n.match(/^(.+?)\s+(edition de base|base|jungle|fossile|equipe rocket|neo genese|neo decouverte|neo revolution|neo destin)$/);
  if (m) {
    const namePart = FR_POKE[m[1]] || m[1];
    const setPart = FR_SETS[m[2]];
    if (setPart) return 'name:"' + namePart + '" set.name:"' + setPart + '"';
  }
  if (n.includes("set.name:")) {
    let out = raw, done = false;
    for (const fr of Object.keys(FR_SETS)) {
      const re = new RegExp('set.name:"?' + fr + '"?', "i");
      if (re.test(out)) { out = out.replace(re, 'set.name:"' + FR_SETS[fr] + '"'); done = true; }
    }
    return done ? out : null;
  }
  return null;
}
function suggestFr(q, max) {
  const n = norm(q); if (n.length < 3) return [];
  const out = [];
  for (const fr of Object.keys(FR_POKE)) {
    if (fr !== n && (fr.startsWith(n.slice(0, 3)) || (n.length >= 4 && fr.includes(n)))) {
      out.push(fr + " (" + FR_POKE[fr] + ")");
      if (out.length >= (max || 3)) break;
    }
  }
  return [...new Set(out)];
}

// ---------- Affichage en français (reverse du dictionnaire) ----------
const SMALL_WORDS = new Set(["et", "de", "des", "du", "la", "le", "les", "au", "aux", "a"]);
const prettify = (s) => s.split(" ").map((w, i) => {
  if (!w) return w;
  if (i > 0 && SMALL_WORDS.has(w)) return w;
  return w.charAt(0).toUpperCase() + w.slice(1);
}).join(" ");
const EN_POKE = {};
for (const fr in FR_POKE) EN_POKE[FR_POKE[fr]] = prettify(fr);
const EN_SETS = {};
for (const fr in FR_SETS) EN_SETS[FR_SETS[fr]] = prettify(fr);
const EN_POKE_KEYS = Object.keys(EN_POKE).sort((a, b) => b.length - a.length);
function frName(n) {
  if (!n) return n;
  if (EN_POKE[n]) return EN_POKE[n];
  for (const k of EN_POKE_KEYS) {
    if (n.startsWith(k + " ")) return EN_POKE[k] + n.slice(k.length);
  }
  return n;
}
function frSet(s) { return (s && EN_SETS[s]) || s; }
function cmUrl(c) {
  return "https://www.cardmarket.com/fr/Pokemon/Products/Singles?searchQuery=" + encodeURIComponent(c.name);
}

// ---------- Connexion API (direct puis proxys en repli) ----------
const PROXY_ROUTES = [
  { label: "directe", wrap: (u) => u },
  { label: "proxy allorigins", wrap: (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
  { label: "proxy codetabs", wrap: (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u) },
  { label: "proxy jina", wrap: (u) => "https://r.jina.ai/" + u },
];
let lastRoute = null;
async function fetchJson(url) {
  let lastErr = null;
  for (const route of PROXY_ROUTES) {
    try {
      const res = await fetch(route.wrap(url));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      const start = txt.indexOf("{");
      if (start === -1) throw new Error("JSON illisible");
      const json = JSON.parse(start === 0 ? txt : txt.slice(start));
      lastRoute = route.label;
      return json;
    } catch (e) { lastErr = e; }
  }
  throw new Error("Connexion à l'API Pokemon TCG impossible (" + (lastErr && lastErr.message ? lastErr.message : "erreur réseau") + "). Vérifiez votre connexion internet et réessayez.");
}
async function apiSearch(query) {
  const q = encodeURIComponent(query);
  const json = await fetchJson(API + "/cards?q=" + q + "&pageSize=40&orderBy=set.releaseDate:desc");
  if (!json || !Array.isArray(json.data)) throw new Error("Réponse API inattendue.");
  return json.data;
}
async function apiGetCard(id) {
  try {
    const json = await fetchJson(API + "/cards/" + encodeURIComponent(id));
    return (json && json.data) || null;
  } catch (e) { return null; }
}
const VARIANT_LABELS = { normal: "Normal", holofoil: "Holo", reverseHolofoil: "Reverse Holo" };
const variantLabel = (k) => VARIANT_LABELS[k] || k;
function availableVariants(card) {
  const tp = (card && card.tcgplayer && card.tcgplayer.prices) || {};
  return Object.keys(tp)
    .filter((k) => tp[k] && typeof tp[k].market === "number")
    .map((k) => ({ key: variantLabel(k), price: tp[k].market }));
}
function extractPrice(card, variant) {
  const tp = (card && card.tcgplayer && card.tcgplayer.prices) || {};
  if (variant) {
    for (const k of Object.keys(tp)) {
      if (variantLabel(k) === variant && typeof tp[k].market === "number") return { market: tp[k].market, source: "TCGPlayer market" };
    }
  }
  for (const k of Object.keys(tp)) if (typeof tp[k].market === "number") return { market: tp[k].market, source: "TCGPlayer market" };
  const cm = card && card.cardmarket && card.cardmarket.prices;
  if (cm && typeof cm.averageSellPrice === "number") return { market: cm.averageSellPrice, source: "CardMarket moyenne" };
  if (cm && typeof cm.trendPrice === "number") return { market: cm.trendPrice, source: "CardMarket tendance" };
  return { market: null, source: "" };
}

const fmtPrice = (v) => (v == null ? "—" : v.toFixed(2) + " $");
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }) : "—";
const key = (c) => c.id + "|" + c.variant;

function compressImage(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxSize / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.75));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function runSearch(ev) {
  if (ev) ev.preventDefault();
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  ui.search = q; ui.searching = true; ui.error = null; ui.note = null; ui.results = [];
  render();
  try {
    const fr = translateQuery(q);
    const build = (s) => (/[:"]/.test(s) ? s : 'name:"' + s + '"');
    const attempts = [];
    if (fr && fr.toLowerCase() !== q.toLowerCase()) attempts.push({ q: fr, label: "Recherche traduite : « " + fr + " » (depuis « " + q + " »)" });
    attempts.push({ q: q, label: null });
    let r = [], used = null;
    for (const a of attempts) {
      r = await apiSearch(build(a.q));
      if (r.length > 0) { used = a.label; break; }
    }
    ui.results = r; ui.note = used;
    if (r.length === 0) {
      const sg = suggestFr(q);
      ui.error = "Aucune carte trouvée pour « " + q + " »." + (sg.length ? " Vouliez-vous dire : " + sg.join(", ") + " ?" : "");
    }
  } catch (e) { ui.error = e.message || "Erreur réseau"; }
  ui.searching = false;
  render();
}
function pickResult(id) {
  const apiCard = ui.results.find((r) => r.id === id);
  if (!apiCard) return;
  const variants = availableVariants(apiCard);
  const def = variants.find((v) => v.key === "Normal") || variants[0];
  const p = def ? { market: def.price, source: "TCGPlayer market" } : extractPrice(apiCard);
  ui.pendingVariants = variants;
  ui.pending = {
    id: apiCard.id, variant: def ? def.key : "Normal",
    name: apiCard.name, set: (apiCard.set && apiCard.set.name) || "?",
    number: apiCard.number || "", rarity: apiCard.rarity || "",
    imageUrl: (apiCard.images && apiCard.images.large) || null,
    imageSmall: (apiCard.images && apiCard.images.small) || null,
    photo: ui.photo, qty: 1, condition: "Near Mint",
    price: p.market, priceDate: p.market != null ? new Date().toISOString() : null,
    priceSource: p.source || null,
  };
  render();
}
function changePendingVariant(v) {
  const pv = ui.pendingVariants.find((x) => x.key === v);
  ui.pending.variant = v;
  ui.pending.price = pv ? pv.price : null;
  ui.pending.priceDate = (pv && pv.price != null) ? new Date().toISOString() : null;
  ui.pending.priceSource = pv ? "TCGPlayer market" : null;
  render();
}
function cancelPending() { ui.pending = null; ui.pendingVariants = []; render(); }
function clearPhoto() { ui.photo = null; render(); }
function switchTab(t) { ui.tab = t; render(); }
function confirmAdd() {
  if (!ui.pending) return;
  ui.pending.qty = Math.max(1, parseInt(document.getElementById("pQty").value, 10) || 1);
  ui.pending.condition = document.getElementById("pCond").value;
  const i = cards.findIndex((c) => c.id === ui.pending.id && c.variant === ui.pending.variant);
  if (i >= 0) cards[i].qty += ui.pending.qty;
  else cards.push(ui.pending);
  save();
  ui.pending = null; ui.pendingVariants = []; ui.photo = null; ui.results = []; ui.tab = "list";
  render();
}
function removeCard(k) {
  cards = cards.filter((c) => key(c) !== k);
  save(); render();
}
async function refreshCard(c) {
  const k = key(c);
  ui.busyKeys.add(k); render();
  const fresh = await apiGetCard(c.id);
  const i = cards.findIndex((x) => key(x) === k);
  if (fresh && i >= 0) {
    const p = extractPrice(fresh, c.variant);
    cards[i].price = p.market;
    cards[i].priceDate = p.market != null ? new Date().toISOString() : null;
    cards[i].priceSource = p.source || null;
    save();
  }
  ui.busyKeys.delete(k); render();
}
function refreshCardByKey(k) {
  const c = cards.find((x) => key(x) === k);
  if (c) refreshCard(c);
}
async function refreshAll() {
  if (!cards.length || ui.refreshing) return;
  ui.refreshing = true; ui.refreshMsg = null; render();
  let updated = 0;
  for (let i = 0; i < cards.length; i += 4) {
    await Promise.all(cards.slice(i, i + 4).map(async (c) => {
      const fresh = await apiGetCard(c.id);
      if (fresh) {
        const p = extractPrice(fresh, c.variant);
        if (p.market != null) {
          c.price = p.market; c.priceDate = new Date().toISOString(); c.priceSource = p.source;
          updated++;
        }
      }
    }));
    save(); render();
  }
  ui.refreshing = false;
  ui.refreshMsg = "Cotes US actualisées : " + updated + "/" + cards.length + " carte(s).";
  render();
}
function exportCSV() {
  const headers = ["Nom (FR)","Nom (EN)","Édition (FR)","Édition (EN)","Numéro","Rareté","Variante","État","Quantité","Cote US ($, indicative)","Cote × Qté ($)","Source","Dernière mise à jour","ID API","Photo perso"];
  const e = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const total = cards.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const totalCards = cards.reduce((s, c) => s + c.qty, 0);
  const rows = cards.map((c) => [
    e(frName(c.name)), e(c.name), e(frSet(c.set)), e(c.set), e(c.number), e(c.rarity), e(c.variant), e(c.condition), c.qty,
    c.price != null ? c.price.toFixed(2) : "", c.price != null ? (c.price * c.qty).toFixed(2) : "",
    e(c.priceSource), e(c.priceDate), e(c.id), c.photo ? "oui" : "non",
  ].join(";"));
  const csv = "\uFEFF" + headers.join(";") + "\n" + rows.join("\n") + "\n" + ["TOTAL","","","","","","","",totalCards,"",total.toFixed(2),"","","","","",""].join(";");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "collection-pokemon-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Affichage ----------
function render() {
  const total = cards.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const totalCards = cards.reduce((s, c) => s + c.qty, 0);
  const pricedCount = cards.filter((c) => c.price != null).length;
  document.getElementById("subTitle").textContent =
    totalCards + " carte" + (totalCards > 1 ? "s" : "") + " · Valeur estimée : " + fmtPrice(total);
  document.getElementById("hbtns").innerHTML =
    '<button class="btn ghost" onclick="refreshAll()" ' + (ui.refreshing || !cards.length ? "disabled" : "") + '>' +
    (ui.refreshing ? "Actualisation…" : "🔄 Rafraîchir les cotes") + '</button>' +
    '<button class="btn ghost" onclick="exportCSV()" ' + (!cards.length ? "disabled" : "") + '>⬇️ Export CSV</button>' +
    '<button class="btn light" onclick="switchTab(\'' + (ui.tab === "list" ? "add" : "list") + '\')">' +
    (ui.tab === "list" ? "+ Ajouter une carte" : "← Retour à la liste") + '</button>';

  const main = document.getElementById("main");
  if (ui.tab === "add") {
    main.innerHTML =
      '<section class="card"><h2>📸 Scanner une carte</h2>' +
      '<p class="muted">Prends la carte en photo : elle sera jointe à la fiche. Puis identifie la carte via la recherche ci-dessous (nom + édition).</p>' +
      '<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">' +
      '<div class="row">' +
      '<button class="btn primary" onclick="document.getElementById(\'photoInput\').click()">' + (ui.photo ? "Changer la photo" : "Prendre / choisir une photo") + '</button>' +
      (ui.photo ? '<img src="' + ui.photo + '" style="width:52px;height:72px;object-fit:cover;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.2)">' +
        '<button class="btn line" onclick="clearPhoto()">Retirer</button>' : "") +
      '</div></section>' +
      '<section class="card"><h2>🔎 Saisir le nom et l\'édition</h2>' +
      '<p class="muted">Le nom français est reconnu automatiquement ! Exemples : <code>dracaufeu</code>, <code>tortank edition de base</code></p>' +
      '<form class="row" onsubmit="runSearch(event)">' +
      '<input type="text" id="searchInput" style="flex:1;min-width:180px" placeholder="Nom de la carte (et édition si besoin)…" value="' + esc(ui.search) + '">' +
      '<button class="btn primary" type="submit" ' + (ui.searching ? "disabled" : "") + '>' + (ui.searching ? "…" : "Rechercher") + '</button></form>' +
      (ui.searching ? '<p class="muted" style="margin-top:10px"><span class="spin"></span>Recherche en cours…</p>' : "") +
      (ui.note ? '<div class="note">🇫🇷→🇬🇧 ' + esc(ui.note) + '</div>' : "") +
      (ui.error ? '<p class="err">' + esc(ui.error) + '</p>' : "") +
      '<div class="grid">' + ui.results.map((r) =>
        '<button class="rbtn" onclick="pickResult(\'' + esc(r.id) + '\')">' +
        (r.images && r.images.small ? '<img src="' + esc(r.images.small) + '" alt="">' : '') +
        '<div class="cap"><b>' + esc(frName(r.name)) + '</b>' +
        (frName(r.name) !== r.name ? '<br><span style="color:#94a3b8;font-size:.9em">' + esc(r.name) + '</span>' : '') +
        '<br><span style="color:#64748b">' + esc(frSet((r.set && r.set.name) || "")) + ' · #' + esc(r.number) + '</span></div></button>'
      ).join("") + '</div></section>' +
      (ui.pending ? confirmHtml() : "");
    const pi = document.getElementById("photoInput");
    if (pi) pi.onchange = (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (f) compressImage(f, 400, (d) => { ui.photo = d; render(); });
      ev.target.value = "";
    };
  } else {
    main.innerHTML =
      (ui.refreshMsg ? '<div class="okmsg">' + esc(ui.refreshMsg) + '</div>' : "") +
      (cards.length === 0 ? '<div class="card empty"><div style="font-size:2.2rem">🗃️</div><b>Ta collection est vide.</b><br><span style="font-size:.85rem">Clique sur « + Ajouter une carte » pour scanner ou saisir une carte.</span></div>'
       : listHtml(total, totalCards, pricedCount));
  }
  document.getElementById("footer").innerHTML =
    "Cotes affichées : marché américain (TCGPlayer / eBay), en USD — valeur indicative. Pour la cote du marché français (en euros), touche 🇫🇷 FR sur chaque carte : elle ouvre la fiche Cardmarket. Noms et éditions affichés en français. La collection est enregistrée localement dans ce navigateur." +
    (lastRoute ? '<span style="margin-left:8px;color:#64748b">· Connexion API : ' + esc(lastRoute) + ' ✓</span>' : "");
}

function confirmHtml() {
  const p = ui.pending;
  return '<section class="card" style="border:2px solid #a5b4fc"><h2>✅ Confirmer l\'ajout</h2>' +
    '<div class="row" style="align-items:flex-start">' +
    '<img src="' + esc(p.photo || p.imageSmall || p.imageUrl || "") + '" style="width:90px;height:126px;object-fit:cover;border-radius:10px;background:#e2e8f0">' +
    '<div style="flex:1;min-width:220px">' +
    '<b>' + esc(frName(p.name)) + '</b>' + (frName(p.name) !== p.name ? ' <span style="color:#94a3b8;font-size:.8em">' + esc(p.name) + '</span>' : "") +
    '<div class="meta">' + esc(frSet(p.set)) + (frSet(p.set) !== p.set ? " (" + esc(p.set) + ")" : "") + ' · #' + esc(p.number) + (p.rarity ? " · " + esc(p.rarity) : "") + '</div>' +
    '<div class="meta" style="color:#059669;font-weight:600">Cote US (indicative) : ' + fmtPrice(p.price) + (p.priceSource ? " (" + esc(p.priceSource) + ")" : "") + '</div>' +
    '<div class="meta">🇫🇷 <a href="' + esc(cmUrl(p)) + '" target="_blank" rel="noopener" style="color:#4f46e5">Voir la cote française sur Cardmarket</a></div>' +
    '<div class="row" style="margin:10px 0">' +
    (ui.pendingVariants.length > 1
      ? '<label>Finition <select onchange="changePendingVariant(this.value)" style="margin-left:6px">' +
        ui.pendingVariants.map((v) => '<option value="' + esc(v.key) + '"' + (v.key === p.variant ? " selected" : "") + '>' + esc(v.key) + (v.price != null ? " — " + fmtPrice(v.price) : "") + '</option>').join("") + '</select></label>'
      : '<span class="badge cond">Finition : ' + esc(p.variant) + '</span>') +
    '<label>Quantité <input type="number" id="pQty" min="1" value="' + p.qty + '" style="width:64px;margin-left:6px"></label>' +
    '<label>État <select id="pCond" style="margin-left:6px">' +
    CONDITIONS.map((c) => '<option' + (c === p.condition ? " selected" : "") + '>' + c + '</option>').join("") + '</select></label>' +
    '</div>' +
    '<button class="btn green" onclick="confirmAdd()">Ajouter à ma collection</button> ' +
    '<button class="btn line" onclick="cancelPending()">Annuler</button>' +
    '</div></div></section>';
}

function listHtml(total, totalCards, pricedCount) {
  const sets = [...new Set(cards.map((c) => c.set))].sort((a, b) => a.localeCompare(b));
  const q = ui.filterText.trim().toLowerCase();
  const visible = cards.filter((c) => {
    if (q && !(
      c.name.toLowerCase().includes(q) || frName(c.name).toLowerCase().includes(q) ||
      c.set.toLowerCase().includes(q) || frSet(c.set).toLowerCase().includes(q) ||
      c.rarity.toLowerCase().includes(q) || c.variant.toLowerCase().includes(q))) return false;
    if (ui.filterSet !== "all" && c.set !== ui.filterSet) return false;
    if (ui.hideUnpriced && c.price == null) return false;
    return true;
  }).sort((a, b) => {
    const d = ui.sortDesc ? -1 : 1;
    if (ui.sortBy === "name") return d * a.name.localeCompare(b.name);
    if (ui.sortBy === "set") return d * (a.set.localeCompare(b.set) || String(a.number).localeCompare(String(b.number), undefined, { numeric: true }));
    if (ui.sortBy === "price") return d * ((a.price == null ? -Infinity : a.price) - (b.price == null ? -Infinity : b.price));
    if (ui.sortBy === "rarity") return d * (a.rarity || "").localeCompare(b.rarity || "");
    return d * key(a).localeCompare(key(b));
  });
  const vTotal = visible.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const vCount = visible.reduce((s, c) => s + c.qty, 0);
  return '<section class="card filters"><div class="row">' +
    '<input type="text" id="filterText" style="flex:1;min-width:180px" placeholder="🔍 Filtrer par nom, édition, n°, rareté, finition…" value="' + esc(ui.filterText) + '">' +
    '<label>Trier <select id="sortSel">' +
    [["added","Ajout"],["name","Nom"],["set","Édition"],["price","Cote"],["rarity","Rareté"]].map((o) =>
      '<option value="' + o[0] + '"' + (ui.sortBy === o[0] ? " selected" : "") + '>' + o[1] + '</option>').join("") + '</select></label>' +
    '<button class="btn line" onclick="ui.sortDesc=!ui.sortDesc;render()">' + (ui.sortDesc ? "↓" : "↑") + '</button>' +
    '</div><div class="row">' +
    '<label>Édition <select id="setSel"><option value="all">Toutes</option>' +
    sets.map((s) => '<option value="' + esc(s) + '"' + (ui.filterSet === s ? " selected" : "") + '>' + esc(frSet(s)) + (frSet(s) !== s ? "" : "") + '</option>').join("") + '</select></label>' +
    '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="hpChk" ' + (ui.hideUnpriced ? "checked" : "") + '> Masquer les cartes non cotées</label>' +
    ((ui.filterText || ui.filterSet !== "all" || ui.hideUnpriced) ? '<button class="btn line" style="color:#4f46e5" onclick="ui.filterText=\'\';ui.filterSet=\'all\';ui.hideUnpriced=false;render()">Réinitialiser</button>' : "") +
    '<span style="margin-left:auto;color:#94a3b8;font-size:.75rem">' + vCount + " carte(s) affichée(s) · " + fmtPrice(vTotal) + '</span>' +
    '</div></section>' +
    '<div class="stats">' +
    '<div class="stat"><div class="lab">Cartes</div><div class="val">' + totalCards + '</div></div>' +
    '<div class="stat"><div class="lab">Cotées</div><div class="val">' + pricedCount + "/" + cards.length + '</div></div>' +
    '<div class="stat"><div class="lab">Valeur totale</div><div class="val green">' + fmtPrice(total) + '</div></div>' +
    '</div>' +
    visible.map((c) => itemHtml(c)).join("") +
    (visible.length === 0 ? '<div class="card empty" style="padding:20px">Aucune carte ne correspond aux filtres actuels.</div>' : "");
}
function itemHtml(c) {
  const k = key(c);
  const holo = c.variant === "Holo" || c.variant === "Reverse Holo";
  const src = c.photo || c.imageSmall || c.imageUrl;
  return '<div class="item">' +
    '<img src="' + esc(src || "") + '" alt="">' +
    '<div class="info"><div class="nm">' + esc(frName(c.name)) + (frName(c.name) !== c.name ? ' <span style="color:#94a3b8;font-size:.78em;font-weight:400">' + esc(c.name) + '</span>' : "") +
    '<span class="badge qty">×' + c.qty + '</span>' +
    '<span class="badge cond">' + esc(c.condition) + '</span>' +
    (holo ? '<span class="badge holo">' + (c.variant === "Holo" ? "✨ Holo" : "🔁 Reverse Holo") + '</span>' : "") +
    '</div><div class="meta">' + esc(frSet(c.set)) + ' · #' + esc(c.number) + (c.rarity ? " · " + esc(c.rarity) : "") + " · " + esc(c.variant) + '</div>' +
    '<div class="meta">Cote US (indicative) maj : ' + fmtDate(c.priceDate) + (c.priceSource ? " · " + esc(c.priceSource) : "") + '</div></div>' +
    '<div class="pricebox"><div class="price">' + fmtPrice(c.price) + '</div>' +
    (c.price != null && c.qty > 1 ? '<div style="font-size:.68rem;color:#94a3b8">total ' + fmtPrice(c.price * c.qty) + '</div>' : "") +
    '<div style="margin-top:4px"><a class="xbtn" style="display:inline-block;text-decoration:none" href="' + esc(cmUrl(c)) + '" target="_blank" rel="noopener" title="Voir la cote française (Cardmarket)">🇫🇷 FR</a>' +
    '<button class="xbtn" onclick="refreshCardByKey(\'' + esc(k) + '\')" ' + (ui.busyKeys.has(k) ? "disabled" : "") + ' title="Rafraîchir la cote US">' + (ui.busyKeys.has(k) ? "…" : "🔄") + '</button>' +
    '<button class="xbtn del" onclick="removeCard(\'' + esc(k) + '\')" title="Supprimer">✕</button></div></div></div>';
}

// Écoute des filtres (on synchronise l'état puis on re-render)
document.getElementById("main").addEventListener("input", (ev) => {
  if (ev.target.id === "filterText") { ui.filterText = ev.target.value; render(); }
});
document.getElementById("main").addEventListener("change", (ev) => {
  if (ev.target.id === "sortSel") { ui.sortBy = ev.target.value; ui.sortDesc = ev.target.value === "price"; render(); }
  if (ev.target.id === "setSel") { ui.filterSet = ev.target.value; render(); }
  if (ev.target.id === "hpChk") { ui.hideUnpriced = ev.target.checked; render(); }
});

render();
</script>
