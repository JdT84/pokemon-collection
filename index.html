<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Collection Pokémon v3</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--card2:#232a4a;--txt:#eef1ff;--mut:#9aa3c7;--acc:#ffcb05;--ok:#34d399;--bad:#f87171;--bor:#2e3560;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:14px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:1.3rem;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:var(--mut);font-size:.75rem;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:14px;margin-bottom:14px}
label{font-size:.72rem;color:var(--mut);display:block;margin-bottom:4px}
input,select,button{font-family:inherit;font-size:.95rem;border-radius:8px;border:1px solid var(--bor);background:var(--card2);color:var(--txt);padding:9px 10px}
input,select{width:100%}
button{cursor:pointer;font-weight:600;transition:filter .15s}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-acc{background:var(--acc);color:#1a1a1a;border:none}
.btn-sec{background:var(--card2)}
.btn-mini{padding:5px 9px;font-size:.82rem;border-radius:7px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:12px}
.rescard{background:var(--card2);border:1px solid var(--bor);border-radius:10px;padding:7px;text-align:center;cursor:pointer;transition:transform .1s,border-color .1s}
.rescard:hover{transform:translateY(-2px);border-color:var(--acc)}
.rescard .imw{display:block;width:100%;aspect-ratio:5/7;border-radius:6px;background:linear-gradient(135deg,#232a4a,#151a30);overflow:hidden}
.rescard img{width:100%;height:100%;object-fit:contain;display:block}
.rescard .n{font-size:.78rem;font-weight:700;margin-top:6px;line-height:1.2}
.rescard .s{font-size:.66rem;color:var(--mut);margin-top:2px}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mut);font-size:1.6rem}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.8rem}
.stats b{color:var(--acc)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.66rem;font-weight:700;background:var(--card2);border:1px solid var(--bor);white-space:nowrap}
.badge.holo{background:#312e81;border-color:#6366f1}
.badge.rh{background:#065f46;border-color:#34d399}
.price{font-weight:800;color:var(--ok);white-space:nowrap}
.mut{color:var(--mut);font-size:.68rem}
/* éléments de collection */
.item{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--bor);border-radius:12px;padding:10px;margin-top:10px}
.item .imw{flex:0 0 58px;width:58px;height:81px;border-radius:6px;overflow:hidden;background:#10142a}
.item .imw img{width:100%;height:100%;object-fit:contain;display:block}
.item .mid{flex:1;min-width:0}
.item .mid .nm{font-weight:800;font-size:.9rem;line-height:1.25}
.item .mid .st{font-size:.72rem;color:var(--mut);margin-top:2px;line-height:1.3}
.badge.own.c{background:#1e3a8a;border-color:#60a5fa;cursor:pointer}
.badge.own.m{background:#7c2d12;border-color:#fb923c;cursor:pointer}
.badge.own.none{cursor:pointer}
.item .fin{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .right{text-align:right;flex:0 0 auto}
.item .right .p{font-size:.95rem}
.item .right .tot{font-size:.72rem;color:var(--mut);margin-top:2px}
.item .acts{display:flex;gap:5px;margin-top:7px;justify-content:flex-end;flex-wrap:wrap}
.phbtn{width:34px;height:34px;border-radius:8px;overflow:hidden;padding:0;flex:0 0 auto}
.phbtn img{width:100%;height:100%;object-fit:cover;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal-bg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--bor);border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.modal h3{margin-bottom:10px;font-size:1.05rem}
.mgrid{display:flex;gap:14px;flex-wrap:wrap}
.mgrid .big{width:168px;height:235px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#232a4a,#151a30);flex:0 0 auto}
.mgrid .big img{width:100%;height:100%;object-fit:contain}
.mfields{flex:1;min-width:170px;display:flex;flex-direction:column;gap:10px}
.mfields .val{font-size:.9rem}
.status{font-size:.72rem;margin-top:6px;color:var(--mut)}
.status.err{color:var(--bad)}
.status.ok{color:var(--ok)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters > div:first-child{grid-column:1/-1}}
.toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:22px;font-size:.85rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);padding:10px 18px;border-radius:10px;font-size:.85rem;display:none;z-index:99;max-width:90vw}
.toast.on{display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>⚡ Ma Collection Pokémon — v3</h1>
<div class="sub">Base FR : TCGdex · Cotes € : Pokemon TCG API (CardMarket)</div>

<div class="panel">
  <div class="searchrow">
    <input id="q" placeholder="Nom de la carte en français… (ex. Exagide, Pikachu)">
    <button class="btn-acc" id="btnSearch">Rechercher</button>
  </div>
  <div id="searchStatus" class="status"></div>
  <div id="results" class="grid"></div>
</div>

<div class="panel">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <button class="btn-sec btn-mini" id="btnRefreshAll">🔄 Rafraîchir toutes les cotes</button>
    <button class="btn-sec btn-mini" id="btnCsv">📄 Export CSV</button>
  </div>
  <div style="margin-top:10px" class="filters">
    <div><label>Filtrer (nom, édition)</label><input id="fSearch" placeholder="Filtre…"></div>
    <div><label>Finition</label><select id="fFinish"><option value="">Toutes</option><option>Normale</option><option>Holo</option><option>Reverse Holo</option></select></div>
    <div><label>Propriétaire</label><select id="fOwner"><option value="">Tous</option><option value="Clement">Clement</option><option value="Maxime">Maxime</option></select></div>
    <div><label>Trier par</label><select id="fSort"><option value="name">Nom A→Z</option><option value="set">Édition A→Z</option><option value="price">Cote ↓</option><option value="added">Ajout récent</option></select></div>
  </div>
</div>

<div class="panel">
  <div id="collList"></div>
  <div id="collEmpty" class="empty">Collection vide — recherche une carte pour commencer.</div>
</div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const LS_KEY = "pkmn-collection-v3";
const TCGDEX = "https://api.tcgdex.net/v2/fr";
const PTCG = "https://api.pokemontcg.io/v2/cards";
const detailCache = new Map();

let ui = { results: [], coll: [], filters: { q: "", finish: "", owner: "", sort: "name" }, busy: false };
const OWNERS = ["Clement", "Maxime"];

const $ = id => document.getElementById(id);
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg;
  t.style.borderColor = err ? "var(--bad)" : "var(--acc)";
  t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2600);
}
function status(id, msg, cls) { const el = $(id); el.textContent = msg || ""; el.className = "status" + (cls ? " " + cls : ""); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtDate(iso) { if (!iso) return "—"; try { return new Date(iso).toLocaleDateString("fr-FR"); } catch (e) { return "—"; } }
function eur(n) { return (n == null) ? "—" : n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" }); }
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(ui.coll)); } catch (e) { toast("Stockage plein (photos ?)", true); } }
function load() { try { const raw = localStorage.getItem(LS_KEY); if (raw) ui.coll = JSON.parse(raw) || []; } catch (e) {} }

// ---------- Identifiants / images ----------
// set TCGdex -> set Pokemon TCG (sv04 -> sv4, sv04.5 -> sv4pt5)
function normSet(set) {
  return set.replace(/^sv0(\d)$/, "sv$1").replace(/^sv0(\d)\.5$/, "sv$1pt5");
}
// candidates d'id pour Pokemon TCG API, du plus probable au moins probable
function ptcgCandidates(id) {
  const m = id.match(/^([^-]+)-(.+)$/); if (!m) return [id];
  const set = m[1], num = m[2];
  const numBase = num.replace(/[a-z]$/i, "");            // xy4-65a -> 65
  const numPad = numBase.replace(/^0+(\d)/, "$1");       // 051 -> 51
  const ns = normSet(set);
  const out = [];
  [set + "-" + num, ns + "-" + num, ns + "-" + numBase, ns + "-" + numPad, set + "-" + numPad, set + "-" + numBase]
    .forEach(c => { if (c !== id || out.length === 0) if (out.indexOf(c) < 0) out.push(c); });
  return out.slice(0, 6);
}
// image de secours Pokemon TCG (images.pokemontcg.io) si le numéro est numérique
function ptcgImgUrl(id) {
  const m = id.match(/^([^-]+)-(.+)$/); if (!m) return null;
  const numPad = m[2].replace(/[a-z]$/i, "").replace(/^0+(\d)/, "$1");
  if (!/^\d+$/.test(numPad)) return null;
  return "https://images.pokemontcg.io/" + normSet(m[1]) + "/" + numPad + ".png";
}
// <img> avec chaîne de secours : TCGdex FR -> Pokemon TCG -> masquée
function cardImgHtml(base, id) {
  const main = base ? esc(base + ".png") : "";
  const fb = ptcgImgUrl(id);
  if (!main && !fb) return '<div class="noimg">🃏</div>';
  const onerr = "var u=this.dataset.f;this.dataset.f='';if(u){this.src=u;return;}this.parentNode.innerHTML='<div class=noimg>&#129345;</div>'";
  const src = main || fb, dataFb = (main && fb) ? ' data-f="' + esc(fb) + '"' : "";
  return '<img loading="lazy" src="' + src + '"' + dataFb + ' onerror="' + esc(onerr) + '" alt="">';
}

// ---------- API ----------
async function jfetch(url) {
  const r = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function searchCards(name) {
  status("searchStatus", "Recherche en cours…");
  $("results").innerHTML = "";
  try {
    const list = await jfetch(TCGDEX + "/cards?name=" + encodeURIComponent(name));
    ui.results = (Array.isArray(list) ? list : []).slice(0, 24);
    status("searchStatus", ui.results.length + " carte(s) trouvée(s) — clique pour ajouter.", "ok");
  } catch (e) {
    ui.results = []; status("searchStatus", "Connexion à TCGdex impossible (" + e.message + ")", "err");
  }
  renderResults();
}
async function getDetail(id) {
  if (detailCache.has(id)) return detailCache.get(id);
  const d = await jfetch(TCGDEX + "/cards/" + encodeURIComponent(id));
  detailCache.set(id, d); return d;
}

// cote EUR : Pokemon TCG API (CardMarket), fallback TCGdex pricing
async function getPrice(tcgdexId, finish) {
  let detail = null;
  try { detail = await getDetail(tcgdexId); } catch (e) {}
  const v = (detail && detail.variants) || {};
  const hasNormal = v.normal !== false;
  const hasReverse = v.reverse !== false;
  const hasHolo = v.holo !== false;

  for (const cid of ptcgCandidates(tcgdexId)) {
    try {
      const res = await jfetch(PTCG + "/" + encodeURIComponent(cid));
      const pr = res && res.data && res.data.cardmarket && res.data.cardmarket.prices;
      if (!pr) continue;
      let val = null;
      if (finish === "Normale") val = pr.trendPrice != null ? pr.trendPrice : pr.averageSellPrice;
      else if (finish === "Reverse Holo") {
        val = pr.reverseHoloTrend != null ? pr.reverseHoloTrend : pr.reverseHoloSell;
        if ((val == null || val <= 0) && !hasReverse && hasHolo) val = pr.trendPrice;
      } else { // Holo
        if (hasNormal) val = pr.reverseHoloTrend != null ? pr.reverseHoloTrend : pr.trendPrice;
        else val = pr.trendPrice != null ? pr.trendPrice : pr.reverseHoloTrend;
      }
      if (val != null && val > 0) return { price: val, source: "CardMarket (via Pokémon TCG API)" };
    } catch (e) {}
  }
  // fallback : pricing TCGdex (aussi CardMarket EUR) — ignorer les 0
  const cm = detail && detail.pricing && detail.pricing.cardmarket;
  if (cm) {
    let val = null;
    if (finish === "Normale") val = cm.trend;
    else val = (cm["trend-holo"] != null && cm["trend-holo"] > 0) ? cm["trend-holo"] : cm.trend;
    if (val != null && val > 0) return { price: val, source: "CardMarket (via TCGdex)" };
  }
  return { price: null, source: "Non cotée" };
}

// ---------- Rendu résultats ----------
function renderResults() {
  const g = $("results");
  if (!ui.results.length) { g.innerHTML = ""; return; }
  g.innerHTML = ui.results.map((c, i) =>
    '<div class="rescard" data-i="' + i + '"><span class="imw">' + cardImgHtml(c.image, c.id) + '</span>' +
    '<div class="n">' + esc(c.name) + '</div><div class="s">#' + esc(c.localId) + '</div></div>'
  ).join("");
  g.querySelectorAll(".rescard").forEach(el => el.onclick = () => openModal(ui.results[+el.dataset.i]));
}

// ---------- Modale ajout ----------
function finishesFor(detail) {
  const v = (detail && detail.variants) || {};
  if (!detail || !detail.variants) return ["Normale", "Holo", "Reverse Holo"];
  const out = [];
  if (v.normal !== false) out.push("Normale");
  if (v.holo !== false) out.push("Holo");
  if (v.reverse !== false) out.push("Reverse Holo");
  return out.length ? out : ["Normale"];
}

async function openModal(min) {
  const bg = $("modalBg"), box = $("modalBox");
  bg.classList.add("on");
  bg.onclick = e => { if (e.target === bg) bg.classList.remove("on"); };
  box.innerHTML = '<div class="empty">Chargement…</div>';
  let d;
  try { d = await getDetail(min.id); }
  catch (e) { box.innerHTML = '<div class="empty">Impossible de charger la carte.<br>' + esc(e.message) + '</div>'; return; }
  const fin = finishesFor(d);
  const count = d.set && d.set.cardCount && d.set.cardCount.official || "?";
  box.innerHTML =
    '<h3>' + esc(d.name) + '</h3>' +
    '<div class="mgrid"><span class="big">' + cardImgHtml(d.image, d.id) + '</span>' +
    '<div class="mfields">' +
      '<div><label>Édition</label><div class="val">' + esc((d.set && d.set.name) || "—") + ' · ' + esc(d.rarity || "") + '</div></div>' +
      '<div><label>Numéro</label><div class="val">#' + esc(d.localId) + ' / ' + count + '</div></div>' +
      '<div><label>Propriétaire</label><select id="mOwner">' + OWNERS.map(o => '<option>' + o + '</option>').join("") + '</select></div>' +
      '<div><label>Finition</label><select id="mFin">' + fin.map(f => '<option>' + f + '</option>').join("") + '</select></div>' +
      '<div><label>Quantité</label><input id="mQty" type="number" min="1" value="1"></div>' +
      '<button class="btn-acc" id="mAdd">Ajouter + récupérer la cote</button>' +
      '<div class="status" id="mStatus"></div>' +
    '</div></div>';
  $("mAdd").onclick = async () => {
    const btn = $("mAdd"); btn.disabled = true; btn.textContent = "Récupération de la cote…";
    const finish = $("mFin").value, qty = Math.max(1, parseInt($("mQty").value, 10) || 1);
    const owner = $("mOwner").value;
    const p = await getPrice(min.id, finish);
    ui.coll.push({
      id: min.id, name: d.name, setName: (d.set && d.set.name) || "",
      rarity: d.rarity || "", number: d.localId, image: d.image,
      finish, qty, price: p.price, source: p.source, owner,
      priceDate: p.price != null ? new Date().toISOString() : null,
      added: Date.now(), photo: null
    });
    save(); render();
    bg.classList.remove("on");
    toast(p.price != null ? ("Ajouté : " + eur(p.price)) : "Ajouté (cote indisponible)", p.price == null);
  };
}

// ---------- Collection ----------
function visible() {
  const { q, finish, sort } = ui.filters;
  const ql = q.trim().toLowerCase();
  const list = ui.coll.filter(c =>
    (!ql || (c.name + " " + c.setName).toLowerCase().includes(ql)) &&
    (!finish || c.finish === finish) &&
    (!ui.filters.owner || c.owner === ui.filters.owner)
  );
  const cmp = {
    name: (a, b) => a.name.localeCompare(b.name, "fr") || (a.number || "").localeCompare(b.number || "fr", "fr", { numeric: true }),
    set: (a, b) => (a.setName || "").localeCompare(b.setName || "", "fr") || a.name.localeCompare(b.name, "fr"),
    price: (a, b) => (b.price || 0) - (a.price || 0),
    added: (a, b) => b.added - a.added
  }[sort];
  return list.sort(cmp);
}

function render() {
  const list = visible();
  $("collEmpty").style.display = ui.coll.length ? "none" : "block";
  const cards = ui.coll.reduce((s, c) => s + c.qty, 0);
  const val = ui.coll.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const valOf = o => ui.coll.filter(c => c.owner === o).reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const sets = new Set(ui.coll.map(c => c.setName)).size;
  $("stats").innerHTML =
    "<span>CARTES : <b>" + cards + "</b></span><span>RÉFÉRENCES : <b>" + ui.coll.length +
    "</b></span><span>ÉDITIONS : <b>" + sets + "</b></span><span>VALEUR : <b>" + eur(val) + "</b></span>" +
    '<span>👤 Clement : <b>' + eur(valOf("Clement")) + '</b></span><span>👤 Maxime : <b>' + eur(valOf("Maxime")) + "</b></span>";

  $("collList").innerHTML = list.map(c => {
    const i = ui.coll.indexOf(c);
    const cls = c.finish === "Reverse Holo" ? "rh" : (c.finish === "Holo" ? "holo" : "");
    return '<div class="item">' +
      '<span class="imw">' + cardImgHtml(c.image, c.id) + '</span>' +
      '<div class="mid">' +
        '<div class="nm">' + esc(c.name) + '</div>' +
        '<div class="st">' + esc(c.setName) + ' · #' + esc(c.number) + (c.rarity ? ' · ' + esc(c.rarity) : '') + '</div>' +
        '<div class="fin"><span class="badge ' + cls + '">' + esc(c.finish) + '</span> <span class="badge own ' + (c.owner === "Clement" ? "c" : c.owner === "Maxime" ? "m" : "none") + '" data-act="owner" data-i="' + i + '" title="Changer de propriétaire">👤 ' + esc(c.owner || "?") + '</span> <span class="mut">Maj ' + fmtDate(c.priceDate) + '</span></div>' +
      '</div>' +
      '<button class="btn-sec phbtn" data-act="photo" data-i="' + i + '" title="Photo perso">' +
        (c.photo ? '<img src="' + c.photo + '" alt="">' : '📷') + '</button>' +
      '<div class="right">' +
        '<div class="price p">' + eur(c.price) + '</div>' +
        '<div class="tot">' + c.qty + ' × → <span class="price">' + eur((c.price || 0) * c.qty) + '</span></div>' +
        '<div class="acts">' +
          '<button class="btn-sec btn-mini" data-act="refresh" data-i="' + i + '">🔄</button>' +
          '<button class="btn-sec btn-mini" data-act="del" data-i="' + i + '">🗑</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join("");
  $("collList").querySelectorAll("button[data-act]").forEach(btn => btn.onclick = () => rowAction(btn.dataset.act, +btn.dataset.i));
  $("collList").querySelectorAll(".badge[data-act='owner']").forEach(el => el.onclick = () => rowAction("owner", +el.dataset.i));
}

async function rowAction(act, i) {
  const c = ui.coll[i]; if (!c) return;
  if (act === "del") { ui.coll.splice(i, 1); save(); render(); }
  else if (act === "owner") { const k = OWNERS.indexOf(c.owner); c.owner = OWNERS[(k + 1) % OWNERS.length]; save(); render(); }
  else if (act === "refresh") {
    toast("Cote en cours…");
    const p = await getPrice(c.id, c.finish);
    c.price = p.price; c.source = p.source;
    c.priceDate = p.price != null ? new Date().toISOString() : null;
    save(); render();
    toast(p.price != null ? ("Cote : " + eur(p.price)) : "Cote indisponible", p.price == null);
  }
  else if (act === "photo") attachPhoto(i);
}

function attachPhoto(i) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      const s = Math.min(1, 300 / Math.max(img.width, img.height));
      cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      ui.coll[i].photo = cv.toDataURL("image/jpeg", 0.7);
      URL.revokeObjectURL(img.src); save(); render();
    };
    img.src = URL.createObjectURL(f);
  };
  inp.click();
}

async function refreshAll() {
  if (ui.busy) return; ui.busy = true;
  const btn = $("btnRefreshAll"); btn.disabled = true;
  const items = ui.coll.slice();
  let n = 0;
  for (let k = 0; k < items.length; k += 4) {
    await Promise.all(items.slice(k, k + 4).map(async c => {
      const p = await getPrice(c.id, c.finish);
      c.price = p.price; c.source = p.source;
      c.priceDate = p.price != null ? new Date().toISOString() : null; n++;
    }));
    btn.textContent = "🔄 " + n + "/" + items.length;
    save(); render();
  }
  btn.textContent = "🔄 Rafraîchir toutes les cotes"; btn.disabled = false; ui.busy = false;
  toast("Cotes mises à jour (" + n + ")");
}

function exportCsv() {
  const head = ["Nom FR", "Édition FR", "Numéro", "Rareté", "Finition", "Propriétaire", "Qté", "Cote €", "Total €", "Source", "Maj", "ID"];
  const rows = ui.coll.map(c => [c.name, c.setName, c.number, c.rarity, c.finish, c.owner || "", c.qty, c.price == null ? "" : c.price, (c.price || 0) * c.qty, c.source, fmtDate(c.priceDate), c.id]);
  const csv = [head].concat(rows).map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "collection-pokemon-v3.csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("CSV exporté");
}

// ---------- Init ----------
$("btnSearch").onclick = () => { const v = $("q").value.trim(); if (v) searchCards(v); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("btnSearch").click(); });
$("fSearch").oninput = e => { ui.filters.q = e.target.value; render(); };
$("fFinish").onchange = e => { ui.filters.finish = e.target.value; render(); };
$("fOwner").onchange = e => { ui.filters.owner = e.target.value; render(); };
$("fSort").onchange = e => { ui.filters.sort = e.target.value; render(); };
$("btnRefreshAll").onclick = refreshAll;
$("btnCsv").onclick = exportCsv;
load(); render();
</script>
