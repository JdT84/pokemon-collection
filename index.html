<html lang="fr">

<title>Ma Collection Pokémon — Pokétrace</title>
<style>

  header { background: linear-gradient(90deg,#0f766e,#059669); color: #fff; padding: 18px 16px; }

  h1 { font-size: 1.4rem; margin: 0; }
  .sub { color: rgba(255,255,255,.85); font-size: .85rem; margin-top: 2px; }
  .hbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  main { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .muted { color: #64748b; font-size: .85rem; margin: 0 0 12px; }
  input[type=text], input[type=number], select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: .9rem; font-family: inherit; background: #fff; }
  input:focus, select:focus { outline: 2px solid #6ee7b7; border-color: #059669; }
  .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: .88rem; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn.primary { background: #059669; color: #fff; } .btn.primary:hover { background: #047857; }
  .btn.ghost { background: rgba(255,255,255,.15); color: #fff; } .btn.ghost:hover { background: rgba(255,255,255,.28); }
  .btn.light { background: #fff; color: #059669; } .btn.light:hover { background: #d1fae5; }
  .btn.green { background: #059669; color: #fff; }
  .btn.line { background: #fff; border: 1px solid #cbd5e1; color: #334155; } .btn.line:hover { background: #f8fafc; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .note { background: #d1fae5; color: #065f46; padding: 8px 12px; border-radius: 8px; font-size: .85rem; margin: 10px 0; }
  .err { color: #dc2626; font-size: .85rem; margin: 10px 0; }
  .okmsg { background: #d1fae5; color: #065f46; padding: 8px 12px; border-radius: 8px; font-size: .85rem; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 12px; text-align: center; }
  .stat .lab { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
  .stat .val { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
  .stat .val.green { color: #059669; }
  .item { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 10px 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
  .item img { width: 56px; height: 80px; object-fit: cover; border-radius: 8px; background: #e2e8f0; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .nm { font-weight: 600; }
  .badge { display: inline-block; font-size: .68rem; border-radius: 99px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
  .badge.qty { background: #f1f5f9; color: #334155; }
  .badge.cond { background: #d1fae5; color: #065f46; }
  .badge.holo { background: linear-gradient(90deg,#fde68a,#fef3c7); color: #92400e; font-weight: 600; }
  .meta { color: #64748b; font-size: .75rem; margin-top: 2px; }
  .pricebox { text-align: right; flex-shrink: 0; }
  .price { font-weight: 700; color: #059669; }
  .xbtn { border: 1px solid #e2e8f0; background: #fff; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: .78rem; margin-left: 4px; font-family: inherit; }
  .xbtn.del { border-color: #fecaca; color: #dc2626; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
  .rbtn { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 0; cursor: pointer; overflow: hidden; text-align: left; }
  .rbtn:hover { border-color: #34d399; box-shadow: 0 2px 8px rgba(5,150,105,.2); }
  .rbtn img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #e2e8f0; }
  .rbtn .cap { padding: 6px 8px; font-size: .72rem; }
  .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid #cbd5e1; border-top-color: #059669; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .filters .row { margin-bottom: 8px; }
  footer { max-width: 860px; margin: 0 auto; padding: 0 16px 30px; font-size: .72rem; color: #94a3b8; }
  code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  .empty { text-align: center; color: #64748b; padding: 36px 0; }
  .keycard { max-width: 520px; margin: 40px auto; }
</style>

function translateQuery(raw) {
  const n = norm(raw);
  if (FR_POKE[n]) return FR_POKE[n];
  for (const fr of Object.keys(FR_POKE)) {
    if (n === fr || n.startsWith(fr + " ")) return FR_POKE[fr] + raw.slice(fr.length);
  }
  const m = n.match(/^(.+?)\s+(edition de base|base|jungle|fossile|equipe rocket|neo genese|neo decouverte|neo revolution|neo destin)$/);
  if (m) {
    const namePart = FR_POKE[m[1]] || m[1];
    const setPart = FR_SETS[m[2]];
    if (setPart) return 'name:"' + namePart + '" set.name:"' + setPart + '"';
  }
  if (n.includes("set.name:")) {
    let out = raw, done = false;
    for (const fr of Object.keys(FR_SETS)) {
      const re = new RegExp('set.name:"?' + fr + '"?', "i");
      if (re.test(out)) { out = out.replace(re, 'set.name:"' + FR_SETS[fr] + '"'); done = true; }
    }
    return done ? out : null;
  }
  return null;
}
function suggestFr(q, max) {
  const n = norm(q); if (n.length < 3) return [];
  const out = [];
  for (const fr of Object.keys(FR_POKE)) {
    if (fr !== n && (fr.startsWith(n.slice(0, 3)) || (n.length >= 4 && fr.includes(n)))) {
      out.push(fr + " (" + FR_POKE[fr] + ")");
      if (out.length >= (max || 3)) break;
    }
  }
  return [...new Set(out)];
}

function compressImage(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxSize / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.75));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// ---------- Connexion Pokétrace (throttle 1 req / 2,2 s) ----------
let lastReqTime = 0;
async function ptFetch(path) {
  const wait = 2200 - (Date.now() - lastReqTime);
  if (wait > 0) await sleep(wait);
  lastReqTime = Date.now();
  let res;
  try {
    res = await fetch(PT + path, { headers: { "X-API-Key": apiKey } });
  } catch (e) {
    throw new Error("Connexion à Pokétrace impossible. Vérifiez votre connexion internet.");
  }
  if (res.status === 401 || res.status === 403) {
    ui.needKey = true;
    throw new Error("Clé API refusée par Pokétrace (code " + res.status + "). Vérifiez votre clé sur poketrace.com/dashboard.");
  }
  if (res.status === 429) throw new Error("Limite de requêtes atteinte (Pokétrace). Attendez quelques secondes ou réessayez demain.");
  if (!res.ok) throw new Error("Erreur Pokétrace (code " + res.status + ").");
  return res.json();
}
async function loadQuota() {
  try {
    const j = await ptFetch("/auth/info");
    if (j && j.data && j.data.user) ui.quota = j.data.user;
    render();
  } catch (e) { ui.error = e.message; render(); }
}

// ---------- Prix ----------
function priceFromCard(cardData, condition) {
  if (!cardData || !cardData.prices) return { market: null, source: null };
  const cond = condition || (cardData.conditionOptions && cardData.conditionOptions[0]) || "NEAR_MINT";
  const srcs = ["tcgplayer", "ebay"];
  for (const s of srcs) {
    const t = cardData.prices[s];
    if (!t) continue;
    const p = t[cond];
    if (p && typeof p.avg === "number") return { market: p.avg, source: s === "tcgplayer" ? "TCGPlayer (" + condLabel(cond) + ")" : "eBay (" + condLabel(cond) + ")" };
  }
  // repli : n'importe quelle condition dispo
  for (const s of srcs) {
    const t = cardData.prices[s];
    if (!t) continue;
    const kk = Object.keys(t)[0];
    if (t[kk] && typeof t[kk].avg === "number") return { market: t[kk].avg, source: s === "tcgplayer" ? "TCGPlayer (" + condLabel(kk) + ")" : "eBay (" + condLabel(kk) + ")" };
  }
  return { market: null, source: null };
}
function variantsOf(cardData) {
  const out = [];
  const prices = (cardData && cardData.prices) || {};
  for (const s of ["tcgplayer", "ebay"]) {
    const t = prices[s];
    if (!t) continue;
    for (const cond of Object.keys(t)) if (out.indexOf(cond) === -1) out.push(cond);
  }
  return out;
}

async function runSearch(ev) {
  if (ev) ev.preventDefault();
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  ui.search = q; ui.searching = true; ui.error = null; ui.note = null; ui.results = [];
  render();
  try {
    const fr = translateQuery(q);
    const en = fr && fr !== q ? fr : q;
    if (fr && fr.toLowerCase() !== q.toLowerCase()) ui.note = "Recherche traduite : « " + en + " » (depuis « " + q + " »)";
    const j = await ptFetch("/cards?search=" + encodeURIComponent(en) + "&market=US&limit=24&product_type=single");
    ui.results = (j && j.data) || [];
    if (ui.results.length === 0) {
      const sg = suggestFr(q);
      ui.error = "Aucune carte trouvée pour « " + q + " »." + (sg.length ? " Vouliez-vous dire : " + sg.join(", ") + " ?" : "");
    }
  } catch (e) { ui.error = e.message || "Erreur réseau"; }
  ui.searching = false; render();
}
function pickResult(id) {
  const r = ui.results.find((x) => x.id === id);
  if (!r) return;
  const conds = (r.conditionOptions && r.conditionOptions.length) ? r.conditionOptions : variantsOf(r);
  const cond = conds.indexOf("NEAR_MINT") >= 0 ? "NEAR_MINT" : (conds[0] || "NEAR_MINT");
  const p = priceFromCard(r, cond);
  ui.pending = {
    id: r.id, name: r.name, set: (r.set && r.set.name) || "?",
    number: r.cardNumber || "", variant: r.variant || "Normal", rarity: r.rarity || "",
    image: r.image || null, conditions: conds, condition: cond,
    photo: ui.photo, qty: 1,
    price: p.market, priceDate: p.market != null ? new Date().toISOString() : null, priceSource: p.source,
  };
  render();
}
function changePendingCondition(cond) {
  const r = ui.results.find((x) => x.id === ui.pending.id);
  const p = priceFromCard(r, cond);
  ui.pending.condition = cond;
  ui.pending.price = p.market;
  ui.pending.priceDate = p.market != null ? new Date().toISOString() : null;
  ui.pending.priceSource = p.source;

}
function cancelPending() { ui.pending = null; render(); }
function clearPhoto() { ui.photo = null; render(); }
function switchTab(t) { ui.tab = t; render(); }
function confirmAdd() {
  if (!ui.pending) return;
  ui.pending.qty = Math.max(1, parseInt(document.getElementById("pQty").value, 10) || 1);
  const i = cards.findIndex((c) => c.id === ui.pending.id && c.variant === ui.pending.variant && c.condition === ui.pending.condition);
  if (i >= 0) cards[i].qty += ui.pending.qty;
  else cards.push(ui.pending);
  save();
  ui.pending = null; ui.photo = null; ui.results = []; ui.tab = "list";
  render();
}

// ---------- Cotes ----------
async function refreshCard(c, silent) {
  const k = key(c);
  if (!silent) { ui.busyKeys.add(k); render(); }
  try {
    const j = await ptFetch("/cards/" + encodeURIComponent(c.id));
    const fresh = j && j.data;
    const i = cards.findIndex((x) => key(x) === k);
    if (fresh && i >= 0) {
      const p = priceFromCard(fresh, c.condition);
      cards[i].price = p.market;
      cards[i].priceDate = p.market != null ? new Date().toISOString() : null;
      cards[i].priceSource = p.source;
      save();
    }
  } catch (e) { if (!silent) { ui.error = e.message; } }
  ui.busyKeys.delete(k); render();
}
async function refreshCardByKey(k) { const c = cards.find((x) => key(x) === k); if (c) refreshCard(c); }
async function refreshAll() {
  if (!cards.length || ui.refreshing) return;
  ui.refreshing = true; ui.refreshMsg = "Actualisation des cotes… 0/" + cards.length; render();
  let done = 0;
  for (const c of cards) {
    await refreshCard(c, true);
    done++;
    ui.refreshMsg = "Actualisation des cotes… " + done + "/" + cards.length;
    render();
  }
  ui.refreshing = false;
  ui.refreshMsg = "Cotes actualisées : " + done + " carte(s).";
  render();
  loadQuota();
}

// ---------- Export CSV ----------
function exportCSV() {
  const headers = ["Nom (FR)","Nom (EN)","Édition (FR)","Édition (EN)","Numéro","Variante","Rareté","État","Quantité","Cote US ($)","Cote × Qté ($)","Source US","Maj US","Lien Cardmarket","Cote FR (€)","Cote FR × Qté (€)","Maj FR","ID Pokétrace","Photo perso"];
  const e = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const total = cards.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const totalFR = cards.reduce((s, c) => s + (c.priceFR || 0) * c.qty, 0);
  const totalCards = cards.reduce((s, c) => s + c.qty, 0);
  const rows = cards.map((c) => [
    e(frName(c.name)), e(c.name), e(frSet(c.set)), e(c.set), e(c.number), e(varLabel(c.variant)), e(c.rarity), e(condLabel(c.condition)), c.qty,
    c.price != null ? c.price.toFixed(2) : "", c.price != null ? (c.price * c.qty).toFixed(2) : "",
    e(c.priceSource), e(c.priceDate), e(c.cmExact || ""),
    c.priceFR != null ? c.priceFR.toFixed(2) : "", c.priceFR != null ? (c.priceFR * c.qty).toFixed(2) : "",
    e(c.priceFRDate), e(c.id), c.photo ? "oui" : "non",
  ].join(";"));
  const csv = "\uFEFF" + headers.join(";") + "\n" + rows.join("\n") + "\n" + ["TOTAL","","","","","","","",totalCards,"",total.toFixed(2),"","","",totalFR.toFixed(2),"","","",""].join(";");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "collection-pokemon-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

}

function listHtml(total, totalFR, totalCards, pricedCount, pricedFRCount) {
  const sets = [...new Set(cards.map((c) => c.set))].sort((a, b) => a.localeCompare(b));
  const q = ui.filterText.trim().toLowerCase();
  const visible = cards.filter((c) => {
    const nm = c.name.toLowerCase(), set = c.set.toLowerCase();
    if (q && !(nm.includes(q) || frName(c.name).toLowerCase().includes(q) || set.includes(q) || frSet(c.set).toLowerCase().includes(q) || varLabel(c.variant).toLowerCase().includes(q))) return false;
    if (ui.filterSet !== "all" && c.set !== ui.filterSet) return false;
    if (ui.hideUnpriced && c.price == null) return false;
    return true;
  }).sort((a, b) => {
    const d = ui.sortDesc ? -1 : 1;
    if (ui.sortBy === "name") return d * frName(a.name).localeCompare(frName(b.name));
    if (ui.sortBy === "set") return d * (a.set.localeCompare(b.set) || String(a.number).localeCompare(String(b.number), undefined, { numeric: true }));
    if (ui.sortBy === "price") return d * ((a.price == null ? -Infinity : a.price) - (b.price == null ? -Infinity : b.price));
    return d * key(a).localeCompare(key(b));
  });
  const vTotal = visible.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  const vCount = visible.reduce((s, c) => s + c.qty, 0);
  return '<section class="card filters"><div class="row">' +
    '<input type="text" id="filterText" style="flex:1;min-width:180px" placeholder="🔍 Filtrer (nom FR/EN, édition, finition…)" value="' + esc(ui.filterText) + '">' +
    '<label>Trier <select id="sortSel">' +
    [["added","Ajout"],["name","Nom"],["set","Édition"],["price","Cote"]].map((o) =>
      '<option value="' + o[0] + '"' + (ui.sortBy === o[0] ? " selected" : "") + '>' + o[1] + '</option>').join("") + '</select></label>' +
    '<button class="btn line" onclick="ui.sortDesc=!ui.sortDesc;render()">' + (ui.sortDesc ? "↓" : "↑") + '</button>' +
    '</div><div class="row">' +
    '<label>Édition <select id="setSel"><option value="all">Toutes</option>' +
    sets.map((s) => '<option value="' + esc(s) + '"' + (ui.filterSet === s ? " selected" : "") + '>' + esc(frSet(s)) + '</option>').join("") + '</select></label>' +
    '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="hpChk" ' + (ui.hideUnpriced ? "checked" : "") + '> Masquer non cotées</label>' +
    ((ui.filterText || ui.filterSet !== "all" || ui.hideUnpriced) ? '<button class="btn line" style="color:#059669" onclick="ui.filterText=\'\';ui.filterSet=\'all\';ui.hideUnpriced=false;render()">Réinitialiser</button>' : "") +
    '<span style="margin-left:auto;color:#94a3b8;font-size:.75rem">' + vCount + " carte(s) · " + fmtPrice(vTotal) + '</span>' +
    '</div></section>' +
    '<div class="stats">' +
    '<div class="stat"><div class="lab">Cartes</div><div class="val">' + totalCards + '</div></div>' +
    '<div class="stat"><div class="lab">Cotées US</div><div class="val">' + pricedCount + "/" + cards.length + '</div></div>' +
    '<div class="stat"><div class="lab">Valeur US</div><div class="val green">' + fmtPrice(total) + '</div></div>' +
    (pricedFRCount > 0 ? '<div class="stat"><div class="lab">Valeur FR</div><div class="val" style="color:#059669">' + totalFR.toFixed(2) + ' €</div></div>' : "") +
    '</div>' +
    visible.map((c) => itemHtml(c)).join("") +
    (visible.length === 0 ? '<div class="card empty" style="padding:20px">Aucune carte ne correspond aux filtres.</div>' : "");
}
function itemHtml(c) {
  const k = key(c);
  const holo = c.variant === "Holofoil" || c.variant === "Reverse_Holofoil" || /Holo/.test(c.variant || "");
  const src = c.photo || c.image;
  return '<div class="item">' +
    '<img src="' + esc(src || "") + '" alt="">' +
    '<div class="info"><div class="nm">' + esc(frName(c.name)) + (frName(c.name) !== c.name ? ' <span style="color:#94a3b8;font-size:.78em;font-weight:400">' + esc(c.name) + '</span>' : "") +
    '<span class="badge qty">×' + c.qty + '</span>' +
    '<span class="badge cond">' + esc(condLabel(c.condition)) + '</span>' +
    (holo ? '<span class="badge holo">' + esc(varLabel(c.variant)) + '</span>' : "") +
    '</div><div class="meta">' + esc(frSet(c.set)) + ' · #' + esc(c.number) + " · " + esc(varLabel(c.variant)) + '</div>' +
    '<div class="meta">Cote US maj : ' + fmtDate(c.priceDate) + (c.priceSource ? " · " + esc(c.priceSource) : "") + '</div>' +
    (c.priceFR != null ? '<div class="meta">🇫🇷 FR : <b style="color:#059669">' + c.priceFR.toFixed(2) + ' €</b> · ' + fmtDate(c.priceFRDate) + '</div>' : "") +
    (c.cmExact ? '<div class="meta" style="word-break:break-all"><a href="' + esc(c.cmExact) + '" target="_blank" rel="noopener" style="color:#059669;font-size:.72rem">lien Cardmarket ✓</a></div>' : "") +
    '</div>' +
    '<div class="pricebox"><div class="price">' + fmtPrice(c.price) + '</div>' +
    (c.priceFR != null ? '<div style="font-weight:700;color:#059669">' + c.priceFR.toFixed(2) + ' €</div>' : "") +
    (c.price != null && c.qty > 1 ? '<div style="font-size:.68rem;color:#94a3b8">total ' + fmtPrice(c.price * c.qty) + '</div>' : "") +
    '<div style="margin-top:4px">' +
    '<button class="xbtn" onclick="promptCmLink(\'' + esc(k) + '\')" title="Coller le lien Cardmarket exact">🔗</button>' +
    (c.cmExact ? '<button class="xbtn" onclick="promptFRPrice(\'' + esc(k) + '\')" title="Saisir / coller la cote FR (€)">✎</button>' : "") +
    '<button class="xbtn" onclick="refreshCardByKey(\'' + esc(k) + '\')" ' + (ui.busyKeys.has(k) ? "disabled" : "") + ' title="Rafraîchir la cote US via Pokétrace">' + (ui.busyKeys.has(k) ? "…" : "🔄") + '</button>' +
    '<button class="xbtn del" onclick="removeCard(\'' + esc(k) + '\')" title="Supprimer">✕</button></div></div></div>';
}

// Écoute des filtres
document.getElementById("main").addEventListener("input", (ev) => {
  if (ev.target.id === "filterText") { ui.filterText = ev.target.value; render(); }
});
document.getElementById("main").addEventListener("change", (ev) => {
  if (ev.target.id === "sortSel") { ui.sortBy = ev.target.value; ui.sortDesc = ev.target.value === "price"; render(); }
  if (ev.target.id === "setSel") { ui.filterSet = ev.target.value; render(); }
  if (ev.target.id === "hpChk") { ui.hideUnpriced = ev.target.checked; render(); }
});

render();
if (apiKey) loadQuota();
</script>
</body>
</html>
